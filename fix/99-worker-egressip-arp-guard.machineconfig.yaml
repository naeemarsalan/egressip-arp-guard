# Interim mitigation for stale EgressIP ARP after an EgressIP holder reboots (OCP 4.20.z, OVN-Kubernetes).
# Lab-validated on 4.20.44 only. Not a Red Hat supported fix: review with Red Hat support before
# production use, and remove once the OVN-Kubernetes fixes (OCPBUGS-77068 and the startup GARP race)
# are available in the cluster's release. Applying this MachineConfig reboots the pool's nodes.
# Apply to every pool whose nodes are labelled k8s.ovn.org/egress-assignable.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-egressip-arp-guard
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - path: /usr/local/bin/egressip-arp-guard.sh
        mode: 0755
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
      - name: egressip-arp-guard.service
        enabled: true
        contents: |
          [Unit]
          Description=Silence ARP for failed-over EgressIPs during node shutdown
          # Ordered after kubelet and crio so that on shutdown this unit's ExecStop runs BEFORE they stop,
          # i.e. before the ovnkube-node pod is terminated and the EgressIP fails over.
          After=kubelet.service crio.service ovs-configuration.service
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          ExecStop=/usr/local/bin/egressip-arp-guard.sh stop
          TimeoutStopSec=15
          
          [Install]
          WantedBy=multi-user.target

      - name: egressip-arp-guard-boot.service
        enabled: true
        contents: |
          [Unit]
          Description=Hold back ARP from OVN at boot until ovnkube-node has synced
          After=ovs-configuration.service
          Before=kubelet.service
          
          [Service]
          Type=simple
          ExecStartPre=/usr/local/bin/egressip-arp-guard.sh start
          ExecStart=/usr/local/bin/egressip-arp-guard.sh release
          TimeoutStartSec=120
          
          [Install]
          WantedBy=multi-user.target

